[project]
name = "birthdaymessaging-mobile-backend"
version = "0.1.0"
description = "FastAPI backend for the BirthdayMessaging mobile app — new, standalone system (see MOBILE_APP_ARCHITECTURE_SPEC.md)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.136.3",
    "uvicorn[standard]>=0.22",
    "gunicorn>=22.0.0",
    # [asyncio] extra pulls in greenlet, which sqlalchemy.ext.asyncio
    # requires at import time but does not list as a hard dependency of
    # the base "sqlalchemy" distribution. Without this extra, a clean
    # `pip install -e .` leaves greenlet missing and the app fails at
    # import/collection time with "SQLAlchemy asyncio module requires
    # that the Python 'greenlet' library is installed".
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.28",
    "pyjwt[crypto]>=2.13.0",
    "passlib[argon2]>=1.7",
    "python-dotenv>=1.2.2",
    "pydantic>=2",
    "email-validator>=2",
    "pydantic-settings>=2.14.2",
    "slowapi>=0.1.8",
    "apscheduler>=3.10",
    # S3-compatible client — used against Cloudflare R2 per an explicit
    # team decision (not AWS), see app/core/config.py and
    # app/services/storage.py. boto3 works against any S3-compatible
    # endpoint via a custom endpoint_url, so nothing here is AWS-specific.
    "boto3>=1.40",
    # PayPal Orders/webhook-verification API calls (app/services/paypal.py,
    # §23) — async HTTP client, not just a test dependency (it was
    # previously only under [project.optional-dependencies].test for the
    # FastAPI test client; this app now also calls it at runtime).
    "httpx>=0.27",
    "alembic>=1.13",
    "mako>=1.3.12",
    "sentry-sdk[fastapi]>=1.40",
    "python-multipart>=0.0.31",
]

[project.optional-dependencies]
test = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.21",
    # httpx is now a core dependency (see above) — kept available to tests
    # via that, not duplicated here.
    "pytest-cov>=4",
    "aiosqlite>=0.20",
]
db = [
    "psycopg[binary]>=3.1",
]
lint = [
    "mypy>=1.10",
    "types-passlib>=1.7",
]

[tool.pytest.ini_options]
python_files = "tests/test_*.py"
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
# sqlalchemy.ext.mypy.plugin intentionally omitted: it's for SQLAlchemy's
# legacy 1.4-style declarative mapping. This codebase uses 2.0-style
# Mapped[]/mapped_column() throughout, which mypy understands natively —
# the plugin package isn't even importable against installed sqlalchemy>=2.0
# (confirmed when trying to reuse bm-ts/backend's pyproject.toml verbatim).
exclude = ["alembic/", "app/tests/"]

[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff.lint]
# Explicit rather than relying on ruff's floating default rule set, which has
# changed between versions (observed: newer ruff adds pyupgrade/bugbear rules
# by default that bm-ts/backend's own code doesn't pass either). Pinning this
# keeps CI behavior stable across ruff upgrades instead of silently drifting.
select = ["E4", "E7", "E9", "F"]
