services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-bm_mobile}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432" # distinct host port — bm-ts/backend's db already uses 5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6380:6379" # distinct host port, same reasoning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8001:8000"
    volumes:
      - .:/app
    env_file:
      - .env
    command: >
      bash -c "
        alembic upgrade head &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "

volumes:
  postgres_data:

# No automated-backup-to-bind-mount service here, intentionally. The existing
# backend's db-backup service writes pg_dump archives into ./backups, which
# got committed to git in that repo. Back this database up out-of-band
# (Coolify-managed volume snapshot, or a backup target outside the repo tree)
# rather than reintroducing that pattern.
