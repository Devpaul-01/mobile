  /mobile/contacts/import:
    post:
      tags:
      - mobile-contacts
      summary: Import Contacts Endpoint
      description: "Import a batch of device contacts, deduping against existing ones.\n\
        \nSee ``app/services/dedup.py`` for the full matching rules (\xA715.2). This\n\
        endpoint is a thin transactional wrapper around that service \u2014 all the\n\
        create/update/flag decisions happen there."
      operationId: import_contacts_endpoint_mobile_contacts_import_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactImportRequest'
        required: true
