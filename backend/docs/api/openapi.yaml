components:
  schemas:
    ContactImportBirthday:
      properties:
        month:
          type: integer
          maximum: 12.0
          minimum: 1.0
          title: Month
        day:
          type: integer
          maximum: 31.0
          minimum: 1.0
          title: Day
        year:
          anyOf:
          - type: integer
            maximum: 2100.0
            minimum: 1900.0
          - type: 'null'
          title: Year
      type: object
      required:
      - month
      - day
      title: ContactImportBirthday
    ContactImportItem:
      properties:
        name:
          type: string
          maxLength: 255
          minLength: 1
          title: Name
        phones:
          items:
            $ref: '#/components/schemas/ContactImportPhone'
          type: array
          title: Phones
        emails:
          items:
            type: string
            maxLength: 320
          type: array
          title: Emails
        birthday:
          anyOf:
          - $ref: '#/components/schemas/ContactImportBirthday'
          - type: 'null'
        device_contact_id:
          anyOf:
          - type: string
            maxLength: 255
          - type: 'null'
          title: Device Contact Id
      type: object
      required:
      - name
      title: ContactImportItem
    ContactImportPhone:
      properties:
        value:
          type: string
          maxLength: 32
          minLength: 1
          title: Value
        normalization_failed:
          type: boolean
          title: Normalization Failed
          default: false
      type: object
      required:
      - value
      title: ContactImportPhone
      description: "One phone number for an incoming contact.\n\n``value`` is the\
        \ E.164-normalized number when the client succeeded at\nnormalizing it, or\
        \ the original raw string when it didn't (in which\ncase ``normalization_failed``\
        \ must be true) \u2014 see\nMOBILE_APP_ARCHITECTURE_SPEC.md \xA715.1 step\
        \ 4."
    ContactImportRequest:
      properties:
        contacts:
          items:
            $ref: '#/components/schemas/ContactImportItem'
          type: array
          maxItems: 2000
          minItems: 1
          title: Contacts
      type: object
      required:
      - contacts
      title: ContactImportRequest
    ContactImportResponse:
      properties:
        imported:
          type: integer
          title: Imported
        updated:
          type: integer
          title: Updated
        requires_review:
          items:
            $ref: '#/components/schemas/ContactImportReviewItem'
          type: array
          title: Requires Review
      type: object
      required:
      - imported
      - updated
      title: ContactImportResponse
    ContactImportReviewItem:
      properties:
        name:
          type: string
          title: Name
        device_contact_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Device Contact Id
        matched_contact_ids:
          items:
            type: string
            format: uuid
          type: array
          title: Matched Contact Ids
      type: object
      required:
      - name
      - matched_contact_ids
      title: ContactImportReviewItem
      description: "One incoming row that matched more than one existing contact and\
        \ was\nnot auto-merged \u2014 see MOBILE_APP_ARCHITECTURE_SPEC.md \xA715.2."
    ContactListResponse:
      properties:
        items:
          items:
            $ref: '#/components/schemas/ContactOut'
          type: array
          title: Items
        total:
          type: integer
          title: Total
        limit:
          type: integer
          title: Limit
        offset:
          type: integer
          title: Offset
      type: object
      required:
      - items
      - total
      - limit
