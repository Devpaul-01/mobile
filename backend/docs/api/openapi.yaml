  /mobile/auth/refresh:
    post:
      tags:
      - mobile-auth
      summary: Refresh
      description: Exchange a valid refresh token for a fresh token pair; 401 on invalid/expired/reused
        token.
      operationId: refresh_mobile_auth_refresh_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Bad Request
