          type: string
          title: Name
        birthday_month:
          anyOf:
          - type: integer
          - type: 'null'
          title: Birthday Month
        birthday_day:
          anyOf:
          - type: integer
          - type: 'null'
          title: Birthday Day
        birthday_year:
          anyOf:
          - type: integer
          - type: 'null'
          title: Birthday Year
