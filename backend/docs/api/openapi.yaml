    patch:
      tags:
      - mobile-auth
      summary: Update Me
      description: "Partial update of the current user's name, timezone, and/or\n\
        auto_send_email \u2014 a field left out of the payload is left unchanged.\n\
        See UserProfileUpdate for why ``timezone`` is validated as a real\nIANA zone\
