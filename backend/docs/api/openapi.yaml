components:
  schemas:
    ApprovalChannel:
      type: string
      enum:
      - whatsapp
      title: ApprovalChannel
      description: 'Only ``whatsapp`` exists today — this is a separate enum (rather

        than reusing ``ReminderChannel``) because a ``PendingApproval`` only

        ever exists *for* the whatsapp channel (§17); push/email never create

        one. Kept as its own enum rather than a hardcoded string so a second

        approval-gated channel, if one is ever added, doesn''t need a schema

        migration just to widen a string column''s implied meaning.'
    ApprovalListResponse:
      properties:
        items:
          items:
            $ref: '#/components/schemas/ApprovalOut'
          type: array
          title: Items
        total:
          type: integer
          title: Total
        limit:
          type: integer
          title: Limit
        offset:
          type: integer
          title: Offset
      type: object
      required:
      - items
      - total
      - limit
      - offset
      title: ApprovalListResponse
    ApprovalOut:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        reminder_occurrence_id:
          type: string
          format: uuid
          title: Reminder Occurrence Id
        contact_id:
          type: string
          format: uuid
          title: Contact Id
        channel:
          $ref: '#/components/schemas/ApprovalChannel'
        state:
          $ref: '#/components/schemas/ApprovalState'
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
        expires_at:
          type: string
          format: date-time
          title: Expires At
      type: object
      required:
      - id
      - reminder_occurrence_id
      - contact_id
      - channel
      - state
      - created_at
      - updated_at
      - expires_at
      title: ApprovalOut
    ApprovalState:
      type: string
      enum:
      - pending_approval
      - approved
      - completed
      - link_failed
      - expired
      - dismissed
      title: ApprovalState
      description: 'States for the WhatsApp pending-approval state machine

        (MOBILE_APP_ARCHITECTURE_SPEC.md §17.1). WhatsApp can never be

        auto-sent, so the backend''s job stops at handing the user a

        pre-filled deep link — these states track how far that handoff got,

        not whether the message was actually delivered inside WhatsApp

        (unobservable from here; see ``COMPLETED``''s docstring note on the

        approval service).'
    ContactImportBirthday:
      properties:
        month:
          type: integer
          maximum: 12.0
          minimum: 1.0
          title: Month
        day:
          type: integer
          maximum: 31.0
          minimum: 1.0
          title: Day
        year:
          anyOf:
          - type: integer
            maximum: 2100.0
            minimum: 1900.0
          - type: 'null'
          title: Year
      type: object
      required:
      - month
      - day
      title: ContactImportBirthday
    ContactImportItem:
      properties:
        name:
          type: string
          maxLength: 255
          minLength: 1
          title: Name
        phones:
          items:
            $ref: '#/components/schemas/ContactImportPhone'
          type: array
          title: Phones
        emails:
          items:
            type: string
            maxLength: 320
          type: array
          title: Emails
        birthday:
          anyOf:
          - $ref: '#/components/schemas/ContactImportBirthday'
          - type: 'null'
        device_contact_id:
          anyOf:
          - type: string
            maxLength: 255
          - type: 'null'
          title: Device Contact Id
      type: object
      required:
      - name
      title: ContactImportItem
    ContactImportPhone:
      properties:
        value:
          type: string
          maxLength: 32
          minLength: 1
          title: Value
        normalization_failed:
          type: boolean
          title: Normalization Failed
          default: false
      type: object
      required:
      - value
      title: ContactImportPhone
      description: 'One phone number for an incoming contact.


        ``value`` is the E.164-normalized number when the client succeeded at

        normalizing it, or the original raw string when it didn''t (in which

        case ``normalization_failed`` must be true) — see

        MOBILE_APP_ARCHITECTURE_SPEC.md §15.1 step 4.'
    ContactImportRequest:
      properties:
        contacts:
          items:
            $ref: '#/components/schemas/ContactImportItem'
          type: array
          maxItems: 2000
          minItems: 1
          title: Contacts
      type: object
      required:
      - contacts
      title: ContactImportRequest
    ContactImportResponse:
      properties:
        imported:
          type: integer
          title: Imported
        updated:
          type: integer
          title: Updated
        requires_review:
          items:
            $ref: '#/components/schemas/ContactImportReviewItem'
          type: array
          title: Requires Review
      type: object
      required:
      - imported
      - updated
      title: ContactImportResponse
    ContactImportReviewItem:
      properties:
        name:
          type: string
          title: Name
