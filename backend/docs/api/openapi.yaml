        \ the error, is far\nbetter than discovering it later inside a background\
        \ job with no\ncaller to report it to.\n\n``auto_send_email``: opt-in toggle\
        \ (default False) for automatically\nsending a reminder's birthday-message\
        \ email once the scheduler\nconsiders it close enough to the contact's actual\
        \ birthday, rather\nthan always waiting for the user to approve it from the\
        \ queue \u2014 see\nservices/scheduler.py's \"Birthday-day email\" docstring\
        \ section."
