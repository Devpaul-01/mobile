        birthday is never silently overwritten by a later device re-import.\n\n``future_calendar_import``\
        \ and ``extension_sync`` from the architecture\ndoc's enum are not included\
        \ as values here yet \u2014 nothing in this\ncodebase can produce either of\
        \ them, and an unused enum value is a\nspeculative API surface, not a harmless\
        \ placeholder. Adding one is a\nsingle-line migration when the feature that\
        \ produces it actually ships."
